name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tcg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d tcg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tcg_test?schema=public
      PRISMA_DATABASE_URL: postgresql://ci:ci@localhost:5432/tcg_test?schema=public
      JWT_SECRET: segredo-so-para-os-testes-da-ci
      SEED_ADMIN_PASSWORD: admin-da-ci-123
      SEED_DEMO_PASSWORD: demo-da-ci-123
      AUTH_RATE_LIMIT: 0
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - if: always() && hashFiles('backend/coverage/coverage-summary.json') != ''
        run: node scripts/coverage-summary.mjs
      - if: always() && hashFiles('backend/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage
          retention-days: 14

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

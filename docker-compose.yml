name: pokebox

services:
  tcg-db:
    image: postgres:17-alpine
    container_name: tcg-db-banco
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tcg-db-test:
    image: postgres:17-alpine
    container_name: tcg-db-test
    profiles: [test]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: tcg_test
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d tcg_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: tcg-jaeger
    profiles: [observabilidade]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_HTTP_PORT:-4318}:4318"

  tcg-backend:
    build:
      context: ./backend
      target: dev
    container_name: tcg-backend-container
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && npm run db:seed && exec node --import ./dist/instrumentation.js dist/server.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tcg-db:5432/${POSTGRES_DB}?schema=public
      PRISMA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tcg-db:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      tcg-db:
        condition: service_healthy
        restart: true

  tcg-frontend:
    build:
      context: ./frontend
      target: dev
    container_name: tcg-frontend-container
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      tcg-backend:
        condition: service_healthy

volumes:
  postgres_data:
